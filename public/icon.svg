<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="94" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="4" />

  <!-- Rays of Light -->
  <g opacity="0.3" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="90" x2="256" y2="40" />
    <line x1="180" y1="120" x2="140" y2="80" />
    <line x1="332" y1="120" x2="372" y2="80" />
    <line x1="130" y1="180" x2="80" y2="160" />
    <line x1="382" y1="180" x2="432" y2="160" />
  </g>

  <!-- Open Bible Base / Cover -->
  <path d="M 256,380 C 210,360 140,360 90,370 L 90,190 C 140,180 210,180 256,200 C 302,180 372,180 422,190 L 422,370 C 372,360 302,360 256,380 Z" fill="#78350f" stroke="#b45309" stroke-width="8" stroke-linejoin="round" />

  <!-- Bible Pages -->
  <path d="M 256,370 C 210,350 142,350 96,360 L 96,182 C 142,172 210,172 256,192 C 302,172 370,172 416,182 L 416,360 C 370,350 302,350 256,370 Z" fill="url(#pageGrad)" stroke="#d97706" stroke-width="3" />

  <!-- Spine / Center seam -->
  <line x1="256" y1="192" x2="256" y2="370" stroke="#b45309" stroke-width="4" />

  <!-- Scripture Text Lines (Decorative Left Page) -->
  <line x1="126" y1="216" x2="226" y2="216" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="126" y1="240" x2="226" y2="240" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="126" y1="264" x2="226" y2="264" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="126" y1="288" x2="200" y2="288" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="126" y1="312" x2="226" y2="312" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Scripture Text Lines (Decorative Right Page) -->
  <line x1="286" y1="216" x2="386" y2="216" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="286" y1="240" x2="386" y2="240" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="286" y1="264" x2="386" y2="264" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="286" y1="288" x2="360" y2="288" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="286" y1="312" x2="386" y2="312" stroke="#d97706" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Radiant Golden Cross above Bible -->
  <g filter="url(#glow)">
    <path d="M 256,90 L 256,170 M 230,116 L 282,116" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
  </g>
  <path d="M 256,90 L 256,170 M 230,116 L 282,116" stroke="#fff" stroke-width="6" stroke-linecap="round" />

  <!-- Bookmark Ribbon -->
  <path d="M 256,200 Q 250,290 236,396 L 246,400 L 256,380 L 266,400 L 276,396 Q 262,290 256,200 Z" fill="#dc2626" />

  <!-- Star of David / Holy Star badge at bottom -->
  <circle cx="256" cy="440" r="16" fill="url(#goldGrad)" />
  <path d="M 256,430 L 260,438 L 268,439 L 262,444 L 264,452 L 256,447 L 248,452 L 250,444 L 244,439 L 252,438 Z" fill="#451a03" />
</svg>
